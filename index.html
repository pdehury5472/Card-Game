<!DOCTYPE html>
<html lang="or">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ସେଣ୍ଟୁ - Classic Card Game</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #e0f2fe;
      --card-bg: #ffffff;
      --card-border: #cccccc;
      --card-text: #1a1a1a;
      --accent: #0284c7;
      --text-light: #0f172a;
      --panel-bg: rgba(224, 242, 254, 0.95);
      --inner-border: #0284c7;
    }

    body.theme-pink { 
      --bg-color: #fbe4e8; 
      --accent: #d63384; 
      --text-light: #495057; 
      --panel-bg: rgba(255, 240, 245, 0.95);
      --inner-border: #d63384;
    }
    body.theme-white { 
      --bg-color: #ffffff; 
      --accent: #212529; 
      --text-light: #212529; 
      --panel-bg: rgba(245, 245, 245, 0.95);
      --inner-border: #333333;
    }
    body.theme-skyblue { 
      --bg-color: #e0f2fe; 
      --accent: #0284c7; 
      --text-light: #0f172a; 
      --panel-bg: rgba(224, 242, 254, 0.95);
      --inner-border: #0284c7;
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 6px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Minimal Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 500px;
      height: 28px;
      margin-bottom: 4px;
    }

    .top-bar h1 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--accent);
    }

    .theme-bar {
      display: flex;
      gap: 6px;
    }

    .theme-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid #aaa;
    }

    /* Menu Section */
    .menu-card {
      background: var(--panel-bg);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
    }

    .tab-buttons {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-light);
      padding: 6px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .menu-card input, .menu-card select {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.85rem;
      width: 100%;
    }

    /* Compact Game Canvas (No Scroll) */
    .game-board {
      width: 100%;
      max-width: 500px;
      height: calc(100vh - 40px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
    }

    .status-panel {
      background: var(--panel-bg);
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
    }

    .piles {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 2px 0;
    }

    .pile {
      width: 65px;
      height: 90px;
      border: 2px dashed rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background: rgba(0,0,0,0.02);
      font-size: 0.7rem;
    }

    .card {
      width: 60px;
      height: 88px;
      background-color: var(--card-bg);
      color: var(--card-text);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px;
      font-weight: bold;
      box-shadow: -2px 2px 4px rgba(0,0,0,0.15);
      user-select: none;
      position: relative;
      cursor: grab;
      flex-shrink: 0;
    }

    .card .corner {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      line-height: 0.8;
    }

    .card .inner-frame {
      border: 1px solid var(--inner-border);
      height: 60%;
      margin: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fafafa;
    }

    .card .inner-frame svg { width: 100%; height: 100%; }
    .card .center-suit { font-size: 1.2rem; }
    .card.bottom-corner { transform: rotate(180deg); }
    .card.red { color: #d00000; }
    
    .card.selected { 
      border: 2px solid var(--accent); 
      transform: translateY(-8px); 
      box-shadow: 0 0 8px var(--accent);
    }

    /* Hand container setup */
    .hand-container {
      overflow-x: auto;
      padding: 10px 5px;
      background: var(--panel-bg);
      border-radius: 6px;
      height: 110px;
      display: flex;
      align-items: center;
    }

    .hand { display: flex; align-items: center; }
    .hand .card { margin-right: -24px; }
    .hand .card:last-child { margin-right: 0; }

    /* Quick Messages & Chat Box */
    .chat-box {
      background: var(--panel-bg);
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .quick-msg-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .quick-btn {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-light);
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .like-btn {
      background: #3b82f6 !important;
      color: white !important;
      font-weight: bold;
    }

    .chat-display {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.5);
      padding: 4px 8px;
      border-radius: 4px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .controls {
      display: flex;
      gap: 6px;
    }

    button {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 10px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      flex: 1;
    }

    .viewer-badge {
      background: #8b5cf6;
      color: white;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 0.65rem;
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="theme-skyblue">

  <!-- Minimal Top Bar -->
  <div class="top-bar">
    <h1>ସେଣ୍ଟୁ</h1>
    <div class="theme-bar">
      <div class="theme-dot" style="background:#e0f2fe;" onclick="setTheme('theme-skyblue')"></div>
      <div class="theme-dot" style="background:#fbe4e8;" onclick="setTheme('theme-pink')"></div>
      <div class="theme-dot" style="background:#ffffff;" onclick="setTheme('theme-white')"></div>
    </div>
  </div>

  <!-- Setup Menu -->
  <div class="menu-card" id="room-menu">
    <div class="tab-buttons">
      <button class="tab-btn active" id="tab-create" onclick="switchMode('create')">Create Room</button>
      <button class="tab-btn" id="tab-join" onclick="switchMode('join')">Join Room</button>
    </div>

    <input type="text" id="player-name" placeholder="Your Name">

    <div id="create-section" style="display:flex; flex-direction:column; gap:8px;">
      <button onclick="handleCreateRoom()">Create & Go To Table 🚀</button>
    </div>

    <div id="join-section" class="hidden" style="display:flex; flex-direction:column; gap:8px;">
      <input type="number" id="join-room-id" placeholder="4-Digit Code">
      <select id="join-role-select">
        <option value="player">Player 🎮</option>
        <option value="viewer">Viewer 👁️</option>
      </select>
      <button onclick="handleJoinRoom()">Join & Go To Table 🚀</button>
    </div>
  </div>

  <!-- Single-Screen Game Table -->
  <div class="game-board" id="game-board">
    <div class="status-panel">
      <div>Room: <strong id="display-room-id">-</strong></div>
      <div>User: <strong id="display-player-name" style="color:var(--accent);">-</strong> <span id="role-badge" class="viewer-badge hidden">Viewer</span></div>
      <button onclick="shareRoomLink()" style="padding:2px 6px; flex:none;">🔗 Link</button>
    </div>

    <div class="status-panel">
      <div>Turn: <strong id="current-player">-</strong></div>
      <div id="scores-display">Scores: -</div>
    </div>

    <div class="piles">
      <div class="pile" id="draw-pile" onclick="drawFromDeck()">
        <span>Deck</span>
        <strong id="draw-count">(42)</strong>
      </div>
      <div class="pile" id="discard-pile" onclick="drawFromDiscard()">
        <span>Discard</span>
        <div id="top-discard"></div>
      </div>
    </div>

    <!-- Quick Message Box -->
    <div class="chat-box">
      <div class="quick-msg-bar">
        <button class="quick-btn like-btn" onclick="sendQuickMessage('👍 Like')">👍 Like</button>
        <button class="quick-btn" onclick="sendQuickMessage('ଶୀଘ୍ର ଛାଡ଼େ')">ଶୀଘ୍ର ଛାଡ଼େ</button>
        <button class="quick-btn" onclick="sendQuickMessage('ଛାଡ଼ିବୁ ନି କି')">ଛାଡ଼ିବୁ ନି କି</button>
        <button class="quick-btn" onclick="sendQuickMessage('ତୁ ପାରିବୁ ନି')">ତୁ ପାରିବୁ ନି</button>
        <button class="quick-btn" onclick="sendQuickMessage('କଣ କରୁଛୁ ଯେ')">କଣ କରୁଛୁ ଯେ</button>
      </div>
      <div class="chat-display" id="chat-display">
        <span id="chat-msg" style="font-style:italic; color:#666;">No messages yet...</span>
      </div>
    </div>

    <div class="hand-container">
      <div class="hand" id="player-hand"></div>
    </div>

    <div class="controls">
      <button id="discard-btn" onclick="discardSelectedCard()" disabled>Discard</button>
      <button id="off-btn" onclick="declareOff()">Declare OFF</button>
      <button onclick="leaveRoom()" style="background:#ff4d4d; color:white;">Exit</button>
    </div>
  </div>

  <script>
    const SUITS = ['♠', '♥', '♦', '♣'];
    const RANKS = [
      { label: 'A', value: 1 }, { label: '2', value: 2 }, { label: '3', value: 3 },
      { label: '4', value: 4 }, { label: '5', value: 5 }, { label: '6', value: 6 },
      { label: '7', value: 7 }, { label: '8', value: 8 }, { label: '9', value: 9 },
      { label: '10', value: 10 }, { label: 'J', value: 11 }, { label: 'Q', value: 12 }, { label: 'K', value: 13 }
    ];

    let currentRoomId = '';
    let isHost = false;
    let isViewer = false;
    let peer = null;
    let conn = null;

    let gameState = {
      activePlayers: [],
      turnIndex: 0,
      drawPile: [],
      discardPile: [],
      selectedCardIndex: null,
      hasDrawnThisTurn: false
    };

    function setTheme(themeName) { document.body.className = themeName; }

    function switchMode(mode) {
      if (mode === 'create') {
        document.getElementById('tab-create').classList.add('active');
        document.getElementById('tab-join').classList.remove('active');
        document.getElementById('create-section').classList.remove('hidden');
        document.getElementById('join-section').classList.add('hidden');
      } else {
        document.getElementById('tab-join').classList.add('active');
        document.getElementById('tab-create').classList.remove('active');
        document.getElementById('join-section').classList.remove('hidden');
        document.getElementById('create-section').classList.add('hidden');
      }
    }

    function handleCreateRoom() {
      const playerName = document.getElementById('player-name').value.trim() || 'Host';
      currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();
      isHost = true;
      isViewer = false;

      gameState.activePlayers = [{ name: playerName, hand: [], score: 0 }];
      goToTable(playerName);
    }

    function handleJoinRoom() {
      const playerName = document.getElementById('player-name').value.trim() || 'Guest';
      const roomId = document.getElementById('join-room-id').value.trim();
      const role = document.getElementById('join-role-select').value;

      if (!roomId) return alert('Enter 4-Digit Room Code');

      currentRoomId = roomId;
      isHost = false;
      isViewer = (role === 'viewer');

      if (!isViewer) gameState.activePlayers.push({ name: playerName, hand: [], score: 0 });
      goToTable(playerName);
    }

    function goToTable(playerName) {
      document.getElementById('display-player-name').innerText = playerName;
      document.getElementById('display-room-id').innerText = currentRoomId;
      document.getElementById('room-menu').classList.add('hidden');
      document.getElementById('game-board').style.display = 'flex';

      if (isViewer) {
        document.getElementById('role-badge').classList.remove('hidden');
        document.getElementById('discard-btn').disabled = true;
        document.getElementById('off-btn').disabled = true;
      }

      initGame();
    }

    function sendQuickMessage(text) {
      const name = document.getElementById('display-player-name').innerText;
      document.getElementById('chat-msg').innerHTML = `<strong>${name}:</strong> ${text}`;
    }

    function leaveRoom() {
      document.getElementById('room-menu').classList.remove('hidden');
      document.getElementById('game-board').style.display = 'none';
      document.getElementById('role-badge').classList.add('hidden');
      isHost = false;
      isViewer = false;
    }

    function shareRoomLink() {
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
      if (navigator.clipboard) navigator.clipboard.writeText(shareUrl);
      alert('Room Code copied!');
    }

    function createDeck() {
      let deck = [];
      for (let suit of SUITS) {
        for (let rank of RANKS) {
          deck.push({ suit, label: rank.label, value: rank.value, isRed: suit === '♥' || suit === '♦' });
        }
      }
      return deck.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      const deck = createDeck();
      if (gameState.activePlayers.length === 0) {
        gameState.activePlayers = [{ name: 'Player 1', hand: [], score: 0 }, { name: 'Player 2', hand: [], score: 0 }];
      }
      for (let i = 0; i < gameState.activePlayers.length; i++) {
        gameState.activePlayers[i].hand = deck.splice(0, 10);
      }
      gameState.drawPile = deck;
      gameState.discardPile = [gameState.drawPile.pop()];
      gameState.turnIndex = 0;
      gameState.hasDrawnThisTurn = false;
      gameState.selectedCardIndex = null;
      renderBoard();
    }

    function generateCardHTML(card, index, isSelected = false) {
      if (!card) return '';
      return `
        <div class="card ${card.isRed ? 'red' : ''} ${isSelected ? 'selected' : ''}" data-index="${index}">
          <div class="corner"><span>${card.label}</span><span>${card.suit}</span></div>
          <div class="inner-frame"><div class="center-suit">${card.suit}</div></div>
          <div class="corner bottom-corner"><span>${card.label}</span><span>${card.suit}</span></div>
        </div>
      `;
    }

    function drawFromDeck() {
      if (isViewer || gameState.hasDrawnThisTurn) return;
      if (gameState.drawPile.length === 0) {
        const top = gameState.discardPile.pop();
        gameState.drawPile = gameState.discardPile.sort(() => Math.random() - 0.5);
        gameState.discardPile = [top];
      }
      gameState.activePlayers[gameState.turnIndex].hand.push(gameState.drawPile.pop());
      gameState.hasDrawnThisTurn = true;
      renderBoard();
    }

    function drawFromDiscard() {
      if (isViewer || gameState.hasDrawnThisTurn || gameState.discardPile.length === 0) return;
      gameState.activePlayers[gameState.turnIndex].hand.push(gameState.discardPile.pop());
      gameState.hasDrawnThisTurn = true;
      renderBoard();
    }

    function selectCard(index) {
      if (isViewer) return;
      gameState.selectedCardIndex = index;
      document.getElementById('discard-btn').disabled = !gameState.hasDrawnThisTurn;
      renderBoard();
    }

    function discardSelectedCard() {
      if (isViewer || gameState.selectedCardIndex === null || !gameState.hasDrawnThisTurn) return;
      const currentPlayer = gameState.activePlayers[gameState.turnIndex];
      const discardedCard = currentPlayer.hand.splice(gameState.selectedCardIndex, 1)[0];
      
      gameState.discardPile.push(discardedCard);
      gameState.selectedCardIndex = null;
      gameState.hasDrawnThisTurn = false;
      gameState.turnIndex = (gameState.turnIndex + 1) % gameState.activePlayers.length;
      renderBoard();
    }

    function declareOff() {
      if(isViewer) return;
      const player = gameState.activePlayers[gameState.turnIndex];
      alert(`${player.name} declared OFF!`);
      initGame();
    }

    function renderBoard() {
      if (gameState.activePlayers.length === 0) return;
      
      document.getElementById('current-player').innerText = gameState.activePlayers[gameState.turnIndex].name;
      document.getElementById('draw-count').innerText = `(${gameState.drawPile.length})`;
      
      const scoreStr = gameState.activePlayers.map((p) => `${p.name}: ${p.score}`).join(' | ');
      document.getElementById('scores-display').innerHTML = `Scores: ${scoreStr}`;

      const topDiscardEl = document.getElementById('top-discard');
      if (gameState.discardPile.length > 0) {
        const topCard = gameState.discardPile[gameState.discardPile.length - 1];
        topDiscardEl.innerHTML = generateCardHTML(topCard, 'discard');
      } else {
        topDiscardEl.innerHTML = 'Empty';
      }

      const handEl = document.getElementById('player-hand');
      handEl.innerHTML = '';
      const currentHand = gameState.activePlayers[gameState.turnIndex].hand || [];

      currentHand.forEach((card, idx) => {
        const cardWrapper = document.createElement('div');
        const isSelected = gameState.selectedCardIndex === idx;
        cardWrapper.innerHTML = generateCardHTML(card, idx, isSelected);
        
        const cardElement = cardWrapper.firstElementChild;
        cardElement.onclick = () => selectCard(idx);
        handEl.appendChild(cardElement);
      });
    }
  </script>
</body>
</html>
