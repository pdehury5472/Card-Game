<!DOCTYPE html>
<html lang="or">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ସେଣ୍ଟୁ - Classic Card Game</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #e0f2fe;
      --card-bg: #ffffff;
      --card-border: #cccccc;
      --card-text: #1a1a1a;
      --accent: #0284c7;
      --text-light: #0f172a;
      --panel-bg: rgba(224, 242, 254, 0.95);
      --inner-border: #0284c7;
    }

    body.theme-pink { 
      --bg-color: #fbe4e8; 
      --accent: #d63384; 
      --text-light: #495057; 
      --panel-bg: rgba(255, 240, 245, 0.95);
      --inner-border: #d63384;
    }
    body.theme-white { 
      --bg-color: #ffffff; 
      --accent: #212529; 
      --text-light: #212529; 
      --panel-bg: rgba(245, 245, 245, 0.95);
      --inner-border: #333333;
    }
    body.theme-skyblue { 
      --bg-color: #e0f2fe; 
      --accent: #0284c7; 
      --text-light: #0f172a; 
      --panel-bg: rgba(224, 242, 254, 0.95);
      --inner-border: #0284c7;
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 6px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 500px;
      height: 28px;
      margin-bottom: 4px;
    }

    .top-bar h1 { margin: 0; font-size: 1.1rem; color: var(--accent); }
    .theme-bar { display: flex; gap: 6px; }
    .theme-dot {
      width: 18px; height: 18px; border-radius: 50%;
      cursor: pointer; border: 1px solid #aaa;
    }

    .menu-card {
      background: var(--panel-bg);
      padding: 14px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
    }

    .tab-buttons { display: flex; gap: 6px; }
    .tab-btn {
      flex: 1; background: rgba(0, 0, 0, 0.05);
      color: var(--text-light); padding: 6px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 4px; font-weight: bold;
      cursor: pointer; font-size: 0.8rem;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    .menu-card input, .menu-card select {
      padding: 8px; border-radius: 4px;
      border: 1px solid #ccc; font-size: 0.85rem; width: 100%;
    }

    .game-board {
      width: 100%; max-width: 500px;
      height: calc(100vh - 40px);
      display: none; flex-direction: column;
      justify-content: space-between; gap: 4px;
    }

    .status-panel {
      background: var(--panel-bg);
      padding: 6px 10px; border-radius: 6px;
      display: flex; justify-content: space-between;
      align-items: center; font-size: 0.75rem;
    }

    /* Avatar Grid Setup */
    .players-avatar-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--panel-bg);
      padding: 6px;
      border-radius: 8px;
    }

    .player-avatar-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .avatar-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 2px solid transparent;
    }

    .player-avatar-card.active .avatar-icon {
      border-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .player-name-tag {
      font-size: 0.65rem;
      font-weight: bold;
      margin-top: 2px;
    }

    .bell-btn {
      position: absolute;
      top: -4px;
      right: -8px;
      background: #eab308;
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .piles { display: flex; justify-content: center; gap: 15px; margin: 2px 0; }
    .pile {
      width: 65px; height: 90px;
      border: 2px dashed rgba(0, 0, 0, 0.2);
      border-radius: 6px; display: flex;
      flex-direction: column; justify-content: center;
      align-items: center; cursor: pointer;
      background: rgba(0,0,0,0.02); font-size: 0.7rem;
      position: relative;
    }

    .pile.drag-over {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
    }

    .card {
      width: 60px; height: 88px;
      background-color: var(--card-bg);
      color: var(--card-text);
      border: 1px solid var(--card-border);
      border-radius: 4px; display: flex;
      flex-direction: column; justify-content: space-between;
      padding: 2px; font-weight: bold;
      box-shadow: -2px 2px 4px rgba(0,0,0,0.15);
      user-select: none; position: relative;
      cursor: grab; flex-shrink: 0;
    }

    .card .corner {
      display: flex; flex-direction: column;
      align-items: center; font-size: 0.7rem; line-height: 0.8;
    }
    .card .inner-frame {
      border: 1px solid var(--inner-border);
      height: 60%; margin: 1px; display: flex;
      align-items: center; justify-content: center;
      overflow: hidden; background: #fafafa;
    }
    .card .center-suit { font-size: 1.2rem; }
    .card.bottom-corner { transform: rotate(180deg); }
    .card.red { color: #d00000; }
    .card.selected {
      border: 2px solid var(--accent);
      transform: translateY(-8px);
      box-shadow: 0 0 8px var(--accent);
    }

    .hand-container {
      overflow-x: auto; padding: 10px 5px;
      background: var(--panel-bg); border-radius: 6px;
      min-height: 110px; display: flex; flex-direction: column; gap: 8px;
    }
    
    .sets-wrapper { display: flex; gap: 10px; overflow-x: auto; width: 100%; }
    .card-set-group {
      display: flex;
      background: rgba(0,0,0,0.04);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.1);
    }
    
    .card-set-group .card { margin-right: -32px; }
    .card-set-group .card:last-child { margin-right: 0; }

    .chat-box {
      background: var(--panel-bg); border-radius: 6px;
      padding: 4px; display: flex; flex-direction: column; gap: 4px;
    }
    .quick-msg-bar { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
    .quick-btn {
      background: rgba(0, 0, 0, 0.05); color: var(--text-light);
      border: 1px solid rgba(0, 0, 0, 0.1); padding: 4px 8px;
      border-radius: 12px; font-size: 0.7rem;
      white-space: nowrap; cursor: pointer;
    }
    .like-btn { background: #3b82f6 !important; color: white !important; font-weight: bold; }
    .chat-display {
      font-size: 0.75rem; background: rgba(255, 255, 255, 0.5);
      padding: 4px 8px; border-radius: 4px; height: 24px;
      display: flex; align-items: center; justify-content: space-between; overflow: hidden;
    }

    .controls { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      background-color: var(--accent); color: #ffffff;
      border: none; padding: 8px 10px; font-weight: bold;
      border-radius: 4px; cursor: pointer; font-size: 0.75rem; flex: 1;
    }
    .aux-btn { background-color: #64748b; }
    .viewer-badge {
      background: #8b5cf6; color: white;
      padding: 1px 6px; border-radius: 8px; font-size: 0.65rem;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .hidden { display: none !important; }

    /* Modal for Scoreboard */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: flex;
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal-body {
      background: white; padding: 16px; border-radius: 8px;
      width: 90%; max-width: 320px; text-align: center;
    }
    .modal-table { width: 100%; margin: 10px 0; border-collapse: collapse; }
    .modal-table th, .modal-table td { border: 1px solid #ddd; padding: 6px; font-size: 0.8rem; }
  </style>
</head>
<body class="theme-skyblue">

  <div class="top-bar">
    <h1>ସେଣ୍ଟୁ</h1>
    <div class="theme-bar">
      <div class="theme-dot" style="background:#e0f2fe;" onclick="setTheme('theme-skyblue')"></div>
      <div class="theme-dot" style="background:#fbe4e8;" onclick="setTheme('theme-pink')"></div>
      <div class="theme-dot" style="background:#ffffff;" onclick="setTheme('theme-white')"></div>
    </div>
  </div>

  <div class="menu-card" id="room-menu">
    <div class="tab-buttons">
      <button class="tab-btn active" id="tab-create" onclick="switchMode('create')">Create Room</button>
      <button class="tab-btn" id="tab-join" onclick="switchMode('join')">Join Room</button>
    </div>

    <input type="text" id="player-name" placeholder="Your Name">
    <select id="avatar-select">
      <option value="🦊">🦊 Fox Avatar</option>
      <option value="🐯">🐯 Tiger Avatar</option>
      <option value="🐼">🐼 Panda Avatar</option>
      <option value="🦁">🦁 Lion Avatar</option>
    </select>

    <div id="create-section" style="display:flex; flex-direction:column; gap:8px;">
      <button onclick="handleCreateRoom()">Create & Go To Table 🚀</button>
    </div>

    <div id="join-section" class="hidden" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="join-room-id" placeholder="4-Letter Code" style="text-transform:uppercase">
      <select id="join-role-select">
        <option value="player">Player 🎮</option>
        <option value="viewer">Viewer 👁️</option>
      </select>
      <button onclick="handleJoinRoom()">Join & Go To Table 🚀</button>
    </div>
  </div>

  <div class="game-board" id="game-board">
    <div class="status-panel">
      <div>Room: <strong id="display-room-id">-</strong></div>
      <div>User: <strong id="display-player-name" style="color:var(--accent);">-</strong> <span id="role-badge" class="viewer-badge hidden">Viewer</span></div>
      <button onclick="toggleScoreModal()" style="padding:2px 6px; flex:none;">🏆 Scores</button>
      <button onclick="shareRoomLink()" style="padding:2px 6px; flex:none;">🔗 Link</button>
    </div>

    <!-- Avatar Bar -->
    <div class="players-avatar-bar" id="avatar-bar"></div>

    <div class="piles">
      <div class="pile" id="draw-pile" onclick="drawFromDeck()">
        <span>Deck</span>
        <strong id="draw-count">(0)</strong>
      </div>
      <div class="pile" id="discard-pile" onclick="drawFromDiscard()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        <span>Discard</span>
        <div id="top-discard"></div>
      </div>
    </div>

    <div class="chat-box">
      <div class="quick-msg-bar">
        <button class="quick-btn like-btn" onclick="sendQuickMessage('👍 Like')">👍 Like</button>
        <button class="quick-btn" onclick="sendQuickMessage('ଶୀଘ୍ର ଛାଡ଼େ')">ଶୀଘ୍ର ଛାଡ଼େ</button>
        <button class="quick-btn" onclick="sendQuickMessage('ଛାଡ଼ିବୁ ନି କି')">ଛାଡ଼ିବୁ ନି କି</button>
        <button class="quick-btn" onclick="sendQuickMessage('ତୁ ପାରିବୁ ନି')">ତୁ ପାରିବୁ ନି</button>
      </div>
      <div class="chat-display">
        <span id="chat-msg" style="font-style:italic; color:#666;">No messages yet...</span>
      </div>
    </div>

    <!-- Hand & Card Serial Display -->
    <div class="hand-container">
      <div class="sets-wrapper" id="sets-wrapper"></div>
    </div>

    <div class="controls">
      <button class="aux-btn" onclick="sortHandBySuit()">Sort Suits</button>
      <button class="aux-btn" onclick="sortHandByRank()">Sort Rank</button>
      <button class="aux-btn" onclick="groupSelectedCards()">Group Set (3/4)</button>
      <button id="discard-btn" onclick="discardSelectedCard()" disabled>Discard</button>
      <button id="off-btn" onclick="declareOff()">Declare OFF</button>
      <button onclick="leaveRoom()" style="background:#ff4d4d; color:white; flex:0 0 100%;">Exit</button>
    </div>
  </div>

  <!-- Score Board Modal -->
  <div class="modal-overlay hidden" id="score-modal">
    <div class="modal-body">
      <h3>Global Scoreboard</h3>
      <table class="modal-table">
        <thead><tr><th>Player</th><th>Avatar</th><th>Score</th></tr></thead>
        <tbody id="scoreboard-rows"></tbody>
      </table>
      <button onclick="toggleScoreModal()">Close</button>
    </div>
  </div>

  <script>
    const SUITS = ['♠', '♥', '♦', '♣'];
    const RANKS = [
      { label: 'A', value: 1 }, { label: '2', value: 2 }, { label: '3', value: 3 },
      { label: '4', value: 4 }, { label: '5', value: 5 }, { label: '6', value: 6 },
      { label: '7', value: 7 }, { label: '8', value: 8 }, { label: '9', value: 9 },
      { label: '10', value: 10 }, { label: 'J', value: 11 }, { label: 'Q', value: 12 }, { label: 'K', value: 13 }
    ];

    let currentRoomId = '';
    let isHost = false;
    let isViewer = false;
    let myPeerId = '';
    let localPlayerName = '';
    let localAvatar = '🦊';
    let peer = null;
    let connections = [];

    let gameState = {
      players: [], 
      turnIndex: 0,
      drawPile: [],
      discardPile: [],
      hasDrawnThisTurn: false
    };

    let localSelectedCardIndices = [];
    let localGroups = []; // Stores indices sets [[0,1,2], [3,4,5,6]]

    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        switchMode('join');
        document.getElementById('join-room-id').value = roomParam.toUpperCase();
      }
    });

    function setTheme(themeName) { document.body.className = themeName; }

    function switchMode(mode) {
      if (mode === 'create') {
        document.getElementById('tab-create').classList.add('active');
        document.getElementById('tab-join').classList.remove('active');
        document.getElementById('create-section').classList.remove('hidden');
        document.getElementById('join-section').classList.add('hidden');
      } else {
        document.getElementById('tab-join').classList.add('active');
        document.getElementById('tab-create').classList.remove('active');
        document.getElementById('join-section').classList.remove('hidden');
        document.getElementById('create-section').classList.add('hidden');
      }
    }

    function initPeer(idPrefix, callback) {
      const cleanId = idPrefix ? idPrefix.toLowerCase().replace(/[^a-z0-9]/g, '') : null;
      peer = new Peer(cleanId ? `sentu-room-${cleanId}` : null);

      peer.on('open', (id) => {
        myPeerId = id;
        callback(true);
      });

      peer.on('error', (err) => {
        alert('Network connection error: ' + err.type);
        callback(false);
      });
    }

    function handleCreateRoom() {
      localPlayerName = document.getElementById('player-name').value.trim() || 'Host';
      localAvatar = document.getElementById('avatar-select').value;
      currentRoomId = Math.random().toString(36).substring(2, 6).toUpperCase();
      isHost = true;
      isViewer = false;

      initPeer(currentRoomId, (success) => {
        if (!success) return;
        gameState.players = [{ peerId: myPeerId, name: localPlayerName, avatar: localAvatar, hand: [], score: 0, isViewer: false }];
        
        peer.on('connection', (conn) => {
          connections.push(conn);
          conn.on('data', (data) => handleHostIncomingData(data, conn));
          conn.on('close', () => {
            connections = connections.filter(c => c !== conn);
            gameState.players = gameState.players.filter(p => p.peerId !== conn.peer);
            broadcastState();
          });
        });

        goToTable();
        startNewRound();
      });
    }

    function handleJoinRoom() {
      localPlayerName = document.getElementById('player-name').value.trim() || 'Guest';
      localAvatar = document.getElementById('avatar-select').value;
      const code = document.getElementById('join-room-id').value.trim().toUpperCase();
      const role = document.getElementById('join-role-select').value;

      if (!code) return alert('Enter 4-Letter Room Code');

      currentRoomId = code;
      isHost = false;
      isViewer = (role === 'viewer');

      initPeer(null, (success) => {
        if (!success) return;
        const hostPeerId = `sentu-room-${currentRoomId.toLowerCase()}`;
        const conn = peer.connect(hostPeerId);
        connections = [conn];

        conn.on('open', () => {
          conn.send({
            type: 'JOIN',
            payload: { peerId: myPeerId, name: localPlayerName, avatar: localAvatar, isViewer: isViewer }
          });
          goToTable();
        });

        conn.on('data', (data) => handleClientIncomingData(data));
      });
    }

    function handleHostIncomingData(data, conn) {
      if (data.type === 'JOIN') {
        const existing = gameState.players.find(p => p.peerId === data.payload.peerId);
        if (!existing) {
          gameState.players.push({
            peerId: data.payload.peerId,
            name: data.payload.name,
            avatar: data.payload.avatar,
            hand: [],
            score: 0,
            isViewer: data.payload.isViewer
          });
          if (gameState.drawPile.length > 0 && !data.payload.isViewer) {
            const newPlayer = gameState.players[gameState.players.length - 1];
            newPlayer.hand = gameState.drawPile.splice(0, 10);
          }
        }
        broadcastState();
      } else if (data.type === 'ACTION') {
        executeAction(data.payload.action, data.payload.peerId, data.payload.params);
      } else if (data.type === 'NUDGE') {
        broadcastMessage({ type: 'CHAT', payload: { name: 'SYSTEM', text: `🔔 ${data.payload.from} reminded ${data.payload.to} to play their move!` } });
      } else if (data.type === 'CHAT') {
        broadcastMessage(data);
      }
    }

    function handleClientIncomingData(data) {
      if (data.type === 'STATE_UPDATE') {
        gameState = data.payload;
        renderBoard();
      } else if (data.type === 'CHAT') {
        displayMessage(data.payload.name, data.payload.text);
      }
    }

    function sendActionToHost(action, params = {}) {
      if (isHost) {
        executeAction(action, myPeerId, params);
      } else if (connections[0]) {
        connections[0].send({ type: 'ACTION', payload: { action, peerId: myPeerId, params } });
      }
    }

    function broadcastState() {
      if (!isHost) return;
      connections.forEach(c => c.send({ type: 'STATE_UPDATE', payload: gameState }));
      renderBoard();
    }

    function broadcastMessage(chatData) {
      if (isHost) {
        connections.forEach(c => c.send(chatData));
        displayMessage(chatData.payload.name, chatData.payload.text);
      }
    }

    function executeAction(action, peerId, params) {
      const activePlayers = gameState.players.filter(p => !p.isViewer);
      if (activePlayers.length === 0) return;
      const currentTurnPlayer = activePlayers[gameState.turnIndex];

      if (action === 'DRAW_DECK') {
        if (currentTurnPlayer.peerId !== peerId || gameState.hasDrawnThisTurn) return;
        if (gameState.drawPile.length === 0) {
          if (gameState.discardPile.length <= 1) return;
          const top = gameState.discardPile.pop();
          gameState.drawPile = gameState.discardPile.sort(() => Math.random() - 0.5);
          gameState.discardPile = [top];
        }
        currentTurnPlayer.hand.push(gameState.drawPile.pop());
        gameState.hasDrawnThisTurn = true;
      } 
      else if (action === 'DRAW_DISCARD') {
        if (currentTurnPlayer.peerId !== peerId || gameState.hasDrawnThisTurn || gameState.discardPile.length === 0) return;
        currentTurnPlayer.hand.push(gameState.discardPile.pop());
        gameState.hasDrawnThisTurn = true;
      } 
      else if (action === 'DISCARD') {
        if (currentTurnPlayer.peerId !== peerId || !gameState.hasDrawnThisTurn) return;
        const cardIdx = params.cardIndex;
        if (cardIdx < 0 || cardIdx >= currentTurnPlayer.hand.length) return;

        const discarded = currentTurnPlayer.hand.splice(cardIdx, 1)[0];
        gameState.discardPile.push(discarded);
        gameState.hasDrawnThisTurn = false;
        gameState.turnIndex = (gameState.turnIndex + 1) % activePlayers.length;
      } 
      else if (action === 'DECLARE_OFF') {
        if (currentTurnPlayer.peerId !== peerId) return;
        currentTurnPlayer.score += 25;
        alert(`${currentTurnPlayer.name} declared OFF! Round restarted.`);
        startNewRound();
        return;
      }

      broadcastState();
    }

    function startNewRound() {
      if (!isHost) return;
      const deck = createDeck();
      const active = gameState.players.filter(p => !p.isViewer);

      active.forEach(p => { p.hand = deck.splice(0, 10); });
      gameState.drawPile = deck;
      gameState.discardPile = [gameState.drawPile.pop()];
      gameState.turnIndex = 0;
      gameState.hasDrawnThisTurn = false;
      broadcastState();
    }

    /* Drag & Drop Discarding Controls */
    function handleDragStart(e, idx) {
      e.dataTransfer.setData('text/plain', idx);
    }
    function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const cardIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
      if (!isNaN(cardIdx)) {
        sendActionToHost('DISCARD', { cardIndex: cardIdx });
        localSelectedCardIndices = [];
      }
    }

    /* Sorting and Grouping Logic */
    function sortHandBySuit() {
      const me = gameState.players.find(p => p.peerId === myPeerId);
      if (!me) return;
      me.hand.sort((a, b) => a.suit.localeCompare(b.suit) || a.value - b.value);
      localGroups = [];
      renderBoard();
    }

    function sortHandByRank() {
      const me = gameState.players.find(p => p.peerId === myPeerId);
      if (!me) return;
      me.hand.sort((a, b) => a.value - b.value || a.suit.localeCompare(b.suit));
      localGroups = [];
      renderBoard();
    }

    function groupSelectedCards() {
      if (localSelectedCardIndices.length < 3) {
        return alert("Select at least 3 or 4 cards to form a group/set!");
      }
      localGroups.push([...localSelectedCardIndices]);
      localSelectedCardIndices = [];
      renderBoard();
    }

    function sendNudge(targetName) {
      if (isHost) {
        broadcastMessage({ type: 'CHAT', payload: { name: 'SYSTEM', text: `🔔 ${localPlayerName} reminded ${targetName} to play move!` } });
      } else {
        connections[0].send({ type: 'NUDGE', payload: { from: localPlayerName, to: targetName } });
      }
    }

    function toggleScoreModal() {
      const modal = document.getElementById('score-modal');
      modal.classList.toggle('hidden');

      if (!modal.classList.contains('hidden')) {
        const tbody = document.getElementById('scoreboard-rows');
        tbody.innerHTML = '';
        gameState.players.forEach(p => {
          tbody.innerHTML += `<tr><td>${p.name}</td><td>${p.avatar}</td><td>${p.score}</td></tr>`;
        });
      }
    }

    function goToTable() {
      document.getElementById('display-player-name').innerText = localPlayerName;
      document.getElementById('display-room-id').innerText = currentRoomId;
      document.getElementById('room-menu').classList.add('hidden');
      document.getElementById('game-board').style.display = 'flex';

      if (isViewer) {
        document.getElementById('role-badge').classList.remove('hidden');
        document.getElementById('discard-btn').disabled = true;
        document.getElementById('off-btn').disabled = true;
      }
    }

    function sendQuickMessage(text) {
      const chatPayload = { type: 'CHAT', payload: { name: localPlayerName, text } };
      if (isHost) broadcastMessage(chatPayload);
      else if (connections[0]) connections[0].send(chatPayload);
    }

    function displayMessage(name, text) {
      document.getElementById('chat-msg').innerHTML = `<strong>${name}:</strong> ${text}`;
    }

    function leaveRoom() { if (peer) peer.destroy(); location.reload(); }

    function shareRoomLink() {
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareUrl);
        alert('Room Code & Link copied!');
      }
    }

    function createDeck() {
      let deck = [];
      for (let suit of SUITS) {
        for (let rank of RANKS) {
          deck.push({ suit, label: rank.label, value: rank.value, isRed: suit === '♥' || suit === '♦' });
        }
      }
      return deck.sort(() => Math.random() - 0.5);
    }

    function drawFromDeck() { if (!isViewer) sendActionToHost('DRAW_DECK'); }
    function drawFromDiscard() { if (!isViewer) sendActionToHost('DRAW_DISCARD'); }

    function toggleSelectCard(index) {
      if (isViewer) return;
      const pos = localSelectedCardIndices.indexOf(index);
      if (pos > -1) localSelectedCardIndices.splice(pos, 1);
      else localSelectedCardIndices.push(index);

      document.getElementById('discard-btn').disabled = (localSelectedCardIndices.length !== 1);
      renderBoard();
    }

    function discardSelectedCard() {
      if (isViewer || localSelectedCardIndices.length !== 1) return;
      sendActionToHost('DISCARD', { cardIndex: localSelectedCardIndices[0] });
      localSelectedCardIndices = [];
    }

    function declareOff() { if (!isViewer) sendActionToHost('DECLARE_OFF'); }

    function generateCardHTML(card, index, isSelected = false) {
      if (!card) return '';
      return `
        <div class="card ${card.isRed ? 'red' : ''} ${isSelected ? 'selected' : ''}" 
             draggable="true" 
             ondragstart="handleDragStart(event, ${index})" 
             data-index="${index}">
          <div class="corner"><span>${card.label}</span><span>${card.suit}</span></div>
          <div class="inner-frame"><div class="center-suit">${card.suit}</div></div>
          <div class="corner bottom-corner"><span>${card.label}</span><span>${card.suit}</span></div>
        </div>
      `;
    }

    function renderBoard() {
      const activePlayers = gameState.players.filter(p => !p.isViewer);
      if (activePlayers.length === 0) return;

      const currentTurnPlayer = activePlayers[gameState.turnIndex];
      const isMyTurn = currentTurnPlayer && currentTurnPlayer.peerId === myPeerId;

      document.getElementById('draw-count').innerText = `(${gameState.drawPile.length})`;

      // Render Avatars Bar & Turn Bell
      const avatarBar = document.getElementById('avatar-bar');
      avatarBar.innerHTML = '';
      activePlayers.forEach((p, idx) => {
        const isCurrent = (idx === gameState.turnIndex);
        avatarBar.innerHTML += `
          <div class="player-avatar-card ${isCurrent ? 'active' : ''}">
            <div class="avatar-icon">${p.avatar || '👤'}</div>
            <div class="player-name-tag">${p.name}</div>
            ${isCurrent && p.peerId !== myPeerId ? `<button class="bell-btn" onclick="sendNudge('${p.name}')">🔔</button>` : ''}
          </div>
        `;
      });

      // Discard Pile
      const topDiscardEl = document.getElementById('top-discard');
      if (gameState.discardPile.length > 0) {
        const topCard = gameState.discardPile[gameState.discardPile.length - 1];
        topDiscardEl.innerHTML = generateCardHTML(topCard, 'discard');
      } else {
        topDiscardEl.innerHTML = 'Empty';
      }

      // Render Local Hand & Groups (Sets vs Other Cards)
      const setsWrapper = document.getElementById('sets-wrapper');
      setsWrapper.innerHTML = '';

      const me = gameState.players.find(p => p.peerId === myPeerId);
      const myHand = me ? me.hand : [];

      let groupedIndices = new Set();
      localGroups.forEach((group) => {
        const setDiv = document.createElement('div');
        setDiv.className = 'card-set-group';
        group.forEach(idx => {
          if (myHand[idx]) {
            groupedIndices.add(idx);
            const isSelected = localSelectedCardIndices.includes(idx);
            const cardWrapper = document.createElement('div');
            cardWrapper.innerHTML = generateCardHTML(myHand[idx], idx, isSelected);
            const cardEl = cardWrapper.firstElementChild;
            cardEl.onclick = () => toggleSelectCard(idx);
            setDiv.appendChild(cardEl);
          }
        });
        setsWrapper.appendChild(setDiv);
      });

      // Render standard/other ungrouped cards
      const otherDiv = document.createElement('div');
      otherDiv.className = 'card-set-group';
      myHand.forEach((card, idx) => {
        if (!groupedIndices.has(idx)) {
          const isSelected = localSelectedCardIndices.includes(idx);
          const cardWrapper = document.createElement('div');
          cardWrapper.innerHTML = generateCardHTML(card, idx, isSelected);
          const cardEl = cardWrapper.firstElementChild;
          cardEl.onclick = () => toggleSelectCard(idx);
          otherDiv.appendChild(cardEl);
        }
      });
      setsWrapper.appendChild(otherDiv);

      document.getElementById('discard-btn').disabled = !isMyTurn || !gameState.hasDrawnThisTurn || localSelectedCardIndices.length !== 1;
      document.getElementById('off-btn').disabled = !isMyTurn;
    }
  </script>
</body>
</html>
